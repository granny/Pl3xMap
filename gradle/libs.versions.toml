[versions]
bukkit="26.2.build.+"
minecraft="26.2"

# https://fabricmc.net/develop/
fabricApi="0.152.2+26.2"
fabricLoader="0.19.3"
fabricLoom="1.17-SNAPSHOT"
zstdJni = "1.5.6-4"

#forge="1.20.2-48.0.6"
#forgeGradle="[6.0,6.2)"
#forgeLoader="[48,)"

minotaur="2.+" # https://github.com/modrinth/minotaur
paperweight="2.0.0-beta.21" # https://github.com/PaperMC/Paperweight
run-paper="3.0.2" # https://github.com/jpenilla/run-task
indra-git="4.0.0" # https://github.com/KyoriPowered/indra
shadowJar="8.3.9" # https://github.com/GradleUp/shadow

adventure="5.0.0-SNAPSHOT" # https://github.com/KyoriPowered/adventure
adventureBukkit="b4bfb8a" # https://github.com/OvercastCommunity/adventure-platform
adventureFabric="7.0.0-SNAPSHOT" # https://github.com/KyoriPowered/adventure-platform-fabric

cloud="2.0.0" # https://github.com/incendo/cloud
cloud-minecraft="2.0.0-SNAPSHOT" # https://github.com/Incendo/cloud-minecraft
cloud-minecraft-modded="2.0.0-SNAPSHOT" # https://github.com/Incendo/cloud-minecraft-modded
cloud-processors="1.0.0-rc.1" # https://github.com/Incendo/cloud-processors

caffeine="3.2.3" # https://github.com/ben-manes/caffeine
gson="2.13.2" # https://github.com/google/gson
guava="33.5.0-jre" # https://github.com/google/guava
log4j="2.25.2" # https://github.com/apache/logging-log4j2

bluenbt="3.5.0" # https://github.com/BlueMap-Minecraft/BlueNBT

lz4Java="1.11.0" # https://github.com/yawkat/lz4-java
simpleYaml="1.8.4" # https://github.com/Carleslc/Simple-YAML
slf4j="2.0.1"
undertow="2.4.1.Final" # https://github.com/undertow-io/undertow
#xnio="3.8.8.Final"


[plugins]
minotaur = { id = "com.modrinth.minotaur", version.ref = "minotaur" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadowJar" }
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "fabricLoom" }
indra-git = { id = "net.kyori.indra.git", version.ref = "indra-git" }
paperweight-userdev = { id = "io.papermc.paperweight.userdev", version.ref = "paperweight" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-paper" }

[libraries]
zstdJni = { module = "com.github.luben:zstd-jni", version.ref = "zstdJni" }
minecraft = { group = "com.mojang", name = "minecraft", version.ref = "minecraft" }

log4j = { group = "org.apache.logging.log4j", name = "log4j-core", version.ref = "log4j" }

jspecifyAnnotations = { group = "org.jspecify", name = "jspecify", version = "1.0.0" }

undertow = { group = "io.undertow", name = "undertow-core", version.ref = "undertow" }

fabric-loader = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fabricLoader" }
fabric-api = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "fabricApi" }

cloudCore = { group = "org.incendo", name = "cloud-core", version.ref = "cloud" }
cloudBrigadier = { group = "org.incendo", name = "cloud-brigadier", version.ref = "cloud-minecraft" }
cloudPaper = { group = "org.incendo", name = "cloud-paper", version.ref = "cloud-minecraft" }
cloudMinecraftExtras = { group = "org.incendo", name = "cloud-minecraft-extras", version.ref = "cloud-minecraft" }
cloudFabric = { group = "org.incendo", name = "cloud-fabric", version.ref = "cloud-minecraft-modded" }
cloudProcessorsConfirmation = { group = "org.incendo", name = "cloud-processors-confirmation", version.ref = "cloud-processors" }

adventureApi = { group = "net.kyori", name = "adventure-api", version.ref = "adventure" }
adventureTextMinimessage = { group = "net.kyori", name = "adventure-text-minimessage", version.ref = "adventure" }
adventureTextSerializerPlain = { group = "net.kyori", name = "adventure-text-serializer-plain", version.ref = "adventure" }

adventurePlatformFacet = { group = "com.github.OvercastCommunity.adventure-platform", name = "adventure-platform-facet", version.ref = "adventureBukkit" }
adventurePlatformBukkit = { group = "com.github.OvercastCommunity.adventure-platform", name = "adventure-platform-bukkit", version.ref = "adventureBukkit" }
adventurePlatformFabric = { group = "net.kyori", name = "adventure-platform-fabric", version.ref = "adventureFabric" }

bluenbt = { module = "de.bluecolored:bluenbt", version.ref = "bluenbt" }
caffeine = { group = "com.github.ben-manes.caffeine", name = "caffeine", version.ref = "caffeine" }
lz4Java = { group = "at.yawk.lz4", name = "lz4-java", version.ref = "lz4Java" }
simpleYaml = { group = "com.github.Carleslc.Simple-YAML", name = "Simple-Yaml", version.ref = "simpleYaml" }


gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }

[bundles]
adventure = ["adventureApi", "adventureTextMinimessage", "adventureTextSerializerPlain"]
